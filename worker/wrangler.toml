name = "claude-git-in-here-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Origin of the deployed GitHub Pages site (no trailing slash, no path).
# Update this if the Pages URL changes.
ALLOWED_ORIGIN = "https://apratsunrthd.github.io"

# GitHub OAuth App client ID (public identifier — must match config.js's
# GITHUB_CLIENT_ID). Not secret, safe to commit.
GITHUB_CLIENT_ID = ""

# Secrets (never commit these — set via `wrangler secret put <NAME>`):
#   GITHUB_CLIENT_SECRET  — from the GitHub OAuth App
#   ANTHROPIC_API_KEY     — from console.anthropic.com
